<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; color: #1f2937;">
  <h2 style="margin: 0 0 8px; font-size: 18px;"><strong>Ticket #{{ ticket_id }}</strong></h2>
  <p style="margin: 0 0 16px; color: #6b7280;">You have a new reply on this ticket</p>
  <div style="margin: 0 0 20px;">
    <p style="margin: 0 0 8px; font-weight: 600;">Message</p>
    <div style="background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; line-height: 1.6;">
      {{ message }}
    </div>
  </div>
  <p style="margin: 0 0 16px;">Please visit the customer portal to reply to this message.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ portal_link }}" style="display: inline-block; padding: 10px 20px; background-color: #171717; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500;" rel="noopener noreferrer" target="_blank">View Ticket</a>
  </p>
</div>
