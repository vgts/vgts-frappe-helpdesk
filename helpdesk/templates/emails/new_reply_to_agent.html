<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; color: #1f2937;">
  <p style="margin: 0 0 16px;">Hello,</p>
  <p style="margin: 0 0 16px;">You have a new reply on ticket <strong>#{{ ticket_id }}</strong>.</p>
  <table style="margin: 0 0 16px; border-collapse: collapse;">
    <tr><td style="padding: 4px 8px 4px 0; font-weight: 600;">Subject:</td><td style="padding: 4px 0;">{{ ticket_subject }}</td></tr>
    <tr><td style="padding: 4px 8px 4px 0; font-weight: 600;">Raised By:</td><td style="padding: 4px 0;">{{ raised_by }}</td></tr>
    <tr><td style="padding: 4px 8px 4px 0; font-weight: 600;">Priority:</td><td style="padding: 4px 0;">{{ priority }}</td></tr>
  </table>
  <p style="margin: 0 0 24px;">
    <a href="{{ ticket_url }}" style="display: inline-block; padding: 10px 20px; background-color: #171717; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500;">View Ticket</a>
  </p>
  <p style="margin: 0;">Regards,<br />Support Team</p>
</div>
