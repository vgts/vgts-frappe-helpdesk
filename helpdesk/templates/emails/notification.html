<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; color: #1f2937;">
  <h2 style="margin: 0 0 16px; font-size: 18px;">{{ title }}</h2>
  <div style="margin: 0 0 20px;">
    <div style="background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; line-height: 1.6;">
      {{ comment }}
    </div>
  </div>
  <p style="margin: 0 0 24px;">
    <a href="{{ callback_url }}" style="display: inline-block; padding: 10px 20px; background-color: #171717; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 500;">{{ button_label }}</a>
  </p>
</div>
